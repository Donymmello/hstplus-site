<!doctype html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Serviço temporariamente indisponível — HST Plus</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #F6F5F1;
    color: #14181A;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .box { text-align: center; max-width: 440px; }
  .code {
    font-weight: 800;
    font-size: 4.5rem;
    line-height: 1;
    color: #7A1420;
    margin-bottom: 16px;
    letter-spacing: -0.02em;
  }
  h1 { font-size: 1.4rem; margin-bottom: 12px; }
  p { color: rgba(20,24,26,0.68); line-height: 1.6; margin-bottom: 28px; }
  a {
    display: inline-block;
    background: #7A1420;
    color: #fff;
    text-decoration: none;
    padding: 12px 28px;
    font-weight: 600;
    font-size: 0.9rem;
  }
  a:hover { background: #4A0D14; }
</style>
</head>
<body>
  <div class="box">
    <div class="code">503</div>
    <h1>Serviço temporariamente indisponível</h1>
    <p>Estamos com um problema técnico pontual. Já estamos a tratar disto — tenta novamente dentro de alguns minutos.</p>
    <a href="/">Tentar novamente</a>
  </div>
</body>
</html>
