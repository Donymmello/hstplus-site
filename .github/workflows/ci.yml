name: CI

# Corre em todos os pushes e em PRs para main — apanha erros de lint/build
# antes de chegarem à branch principal. Não faz deploy (isso continua manual
# na VPS); só verificação.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Lint + build (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Syntax check (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - working-directory: server
        run: npm ci

      # ponytail: sem testes automatizados no projeto ainda — isto só garante
      # que cada ficheiro é sintaticamente válido. Se um dia houver testes,
      # trocar por `npm test`.
      - working-directory: server
        run: find src -name '*.js' -exec node --check {} \;
