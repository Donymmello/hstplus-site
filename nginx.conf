server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Encaminha os pedidos à API do blog (Facebook/Instagram) para o serviço "api"
    # definido no docker-compose.yml — assim o frontend chama sempre /api/... no
    # mesmo domínio, sem CORS e sem expor a porta do backend publicamente.
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Fotos da galeria, carregadas via /admin e guardadas no serviço "api"
    # (não no build estático do frontend). O "^~" garante que esta regra tem
    # prioridade sobre o bloco de cache de imagens abaixo — sem isto, um
    # pedido a /uploads/galeria/foto.jpg cairia na regex de extensões e
    # devolveria 404 (procuraria o ficheiro no build do frontend, não existe lá).
    location ^~ /uploads/ {
        proxy_pass http://api:4000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Assets com hash no nome (Vite) podem ser cacheados de forma agressiva
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Página única — qualquer rota cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
