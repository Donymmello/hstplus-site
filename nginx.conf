# Detecta bots de redes sociais/motores de busca pelo User-Agent, para lhes
# servir pré-visualizações com a meta tag certa (ver location de /insights/
# mais abaixo). Visitantes normais (is_bot = 0) nunca são afectados por isto.
map $http_user_agent $is_bot {
    default 0;
    ~*facebookexternalhit 1;
    ~*WhatsApp              1;
    ~*LinkedInBot            1;
    ~*Twitterbot            1;
    ~*Slackbot              1;
    ~*TelegramBot           1;
    ~*Discordbot            1;
    ~*Googlebot             1;
    ~*bingbot               1;
    ~*Pinterest             1;
}

server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Página estática de erro 5xx — não depende da API nem do bundle React,
    # por isso continua a funcionar mesmo que o serviço "api" esteja em
    # baixo. proxy_intercept_errors liga isto às locations que fazem proxy.
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }

    # Encaminha os pedidos à API do blog (Facebook/Instagram) para o serviço "api"
    # definido no docker-compose.yml — assim o frontend chama sempre /api/... no
    # mesmo domínio, sem CORS e sem expor a porta do backend publicamente.
    location /api/ {
        proxy_intercept_errors on;
        proxy_pass http://api:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Fotos da galeria, carregadas via /admin e guardadas no serviço "api"
    # (não no build estático do frontend). O "^~" garante que esta regra tem
    # prioridade sobre o bloco de cache de imagens abaixo — sem isto, um
    # pedido a /uploads/galeria/foto.jpg cairia na regex de extensões e
    # devolveria 404 (procuraria o ficheiro no build do frontend, não existe lá).
    location ^~ /uploads/ {
        proxy_intercept_errors on;
        proxy_pass http://api:4000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Pré-visualizações correctas ao partilhar um artigo de Insights no
    # WhatsApp/Facebook/LinkedIn/Google — esses crawlers não executam
    # JavaScript, por isso nunca veem o document.title dinâmico do React.
    # Só pedidos identificados como bot (ver "map" no topo do ficheiro
    # principal do nginx) são desviados para o servidor, que devolve HTML já
    # com as meta tags certas para aquele artigo específico. Visitantes
    # humanos normais (is_bot = 0) nem tocam nesta regra — try_files serve o
    # SPA como sempre serviu.
    location ~ ^/insights/([^/]+)/?$ {
        if ($is_bot) {
            proxy_pass http://api:4000/prerender/insights/$1;
            break;
        }
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome (Vite) podem ser cacheados de forma agressiva
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Página única — qualquer rota cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
